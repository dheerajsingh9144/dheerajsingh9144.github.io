<!DOCTYPE html>
<html lang="en">
<head>

  <title>Dheeraj Singh</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.5rem;
      padding: 3rem 3.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1.5rem;
      color: #fff;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .links a:hover {
      color: #a5b4fc;
      border-color: #6366f1;
      background: #1e293b;
    }

    footer {
      margin-top: 3rem;
      color: #475569;
      font-size: 0.8rem;
    }
  </style>
</head>
